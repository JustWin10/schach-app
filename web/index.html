<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Justins Schach-App</title>

</head><body>

<style>
/* Layout: App mit fester Leiste unten (5 Bereiche), eine Spalte am Handy, max. 760px breit; Brett quadratisch mit absolut gesetzten Feldern */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1d2420; --muted:#5d6862; --line:#d9ddd7;
  --accent:#2f6b4f; --accent-fg:#ffffff; --accent-soft:#e2eee7;
  --sq-light:#e9e4d4; --sq-dark:#7f9a86; --sq-hl:rgba(234,196,72,.55); --sq-sel:rgba(47,107,79,.55);
  --good:#2f7d4a; --good-bg:#e4f2e8; --warn:#9a6a10; --warn-bg:#f7eed8; --bad:#b0392f; --bad-bg:#f8e3e0;
  --me:#2f6b4f; --me-fg:#ffffff;
  --f-display:"Bitter",Georgia,serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --f-piece:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa7a0; --line:#2e3833;
  --accent:#7cc4a0; --accent-fg:#0f1512; --accent-soft:#1f3329;
  --sq-light:#d9d3c0; --sq-dark:#6c8a75;
  --good:#7fd19c; --good-bg:#1d3326; --warn:#e2b75a; --warn-bg:#352a14; --bad:#f08b80; --bad-bg:#3a1f1c;
  --me:#2c5a44; --me-fg:#eef5f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa7a0; --line:#2e3833;
  --accent:#7cc4a0; --accent-fg:#0f1512; --accent-soft:#1f3329;
  --sq-light:#d9d3c0; --sq-dark:#6c8a75;
  --good:#7fd19c; --good-bg:#1d3326; --warn:#e2b75a; --warn-bg:#352a14; --bad:#f08b80; --bad-bg:#3a1f1c;
  --me:#2c5a44; --me-fg:#eef5f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
.wrap{max-width:760px;margin:0 auto;padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip{display:flex;height:6px;border-radius:2px;overflow:hidden;width:96px}
.strip i{flex:1;background:var(--sq-light)}.strip i:nth-child(even){background:var(--sq-dark)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.2}
.sync{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-family:var(--f-body);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)}.sync.busy i{background:var(--warn)}.sync.err i{background:var(--bad)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,6vw,2rem);line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;display:flex;align-items:baseline;gap:10px;text-wrap:balance}
h2 small,.eyebrow{font:500 .72rem var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.nota{font-family:var(--f-mono);font-size:.9em}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hero{background:var(--accent-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;hyphens:auto}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.step.done{opacity:.72}
.step .t{font-weight:700}
.step .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--accent);border-radius:6px;margin:2px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.ck:checked{background:var(--accent)}
.ck:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.ck:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:600 .95rem var(--f-body);border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.s{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
a.item{color:inherit;text-decoration:none}
a.item:hover{border-color:var(--accent)}
.item h3{margin:0;font-size:1.02rem;line-height:1.3}
.item p{color:var(--muted);font-size:.93rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:2px}
.tag{font:500 .7rem var(--f-mono);padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.w{background:#fbfaf6;color:#2a2a2a;border-color:#cfcabc}
.tag.s{background:#2a2a2a;color:#f3f1ea;border-color:#6b6b6b}
.tag.new{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tag.wk{border-color:var(--accent);color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.week[open]{border-color:var(--accent)}
details.week summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
details.week summary::-webkit-details-marker{display:none}
.wn{font-family:var(--f-display);font-weight:800;font-size:1.05rem;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.week.cur .wn{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.task label{cursor:pointer}
.task.done label{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.weak{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.count{font:500 .8rem var(--f-mono);color:var(--bad);background:var(--bad-bg);border-radius:999px;padding:2px 9px;white-space:nowrap}
/* Brett */
.trainer-box{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.trainer-box{grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}}
.board{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px var(--sq-dark),0 6px 18px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sq{position:absolute;width:12.5%;height:12.5%;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;border-radius:0;-webkit-tap-highlight-color:transparent}
.sq.l{background:var(--sq-light)}.sq.d{background:var(--sq-dark)}
.sq.hl::before,.sq.sel::before,.sq.ok::before,.sq.no::before{content:"";position:absolute;inset:0}
.sq.hl::before{background:var(--sq-hl)}.sq.sel::before{background:var(--sq-sel)}
.sq.ok::before{background:rgba(47,125,74,.6)}.sq.no::before{background:rgba(176,57,47,.55)}
.sq:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:3}
.dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30%;height:30%;border-radius:50%;background:rgba(20,40,30,.35);z-index:2}
.dot.cap{width:86%;height:86%;background:transparent;border:4px solid rgba(20,40,30,.35)}
.pc{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-family:var(--f-piece);font-size:var(--pc,36px);line-height:1;pointer-events:none}
.pc span{grid-area:1/1}
.pc.w .f{color:#fbfaf6}.pc.w .o{color:#1b1f1c}.pc.b .f{color:#1b1f1c}.pc.b .o{color:#1b1f1c}
.coord{position:absolute;font-family:var(--f-mono);font-size:10px;line-height:1;z-index:1;pointer-events:none}
.coord.r{top:3px;left:3px}.coord.f{bottom:3px;right:4px}
.sq.l .coord{color:var(--sq-dark)}.sq.d .coord{color:var(--sq-light)}
.ask{font-size:1.08rem;font-weight:700;text-wrap:balance}
.moves{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.turn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.turn i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fg)}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb b{font-size:1rem}
.fb.good{background:var(--good-bg)}.fb.good b{color:var(--good)}
.fb.warn{background:var(--warn-bg)}.fb.warn b{color:var(--warn)}
.fb.bad{background:var(--bad-bg)}.fb.bad b{color:var(--bad)}
.fb.info{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Chat */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;font:600 .92rem var(--f-body);border:0;border-radius:7px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;overflow-wrap:anywhere;min-width:0}
.msg.u{align-self:flex-end;background:var(--me);color:var(--me-fg);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p+p,.msg.a ul{margin-top:6px}
.msg.a ul{margin-bottom:0;padding-left:20px}
.msg .tools{display:flex;gap:6px;margin-top:6px}
.compose{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:6px}
textarea{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--fg);resize:vertical}
textarea:focus-visible,input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text]{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--fg)}
.compose textarea{min-height:46px;max-height:160px;resize:none}
.small{font-size:.85rem}
.ana h3{margin:0;font-family:var(--f-display);font-size:1rem}
.mist{border-left:3px solid var(--bad);padding-left:10px;display:flex;flex-direction:column;gap:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 .72rem var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font:700 .65rem var(--f-body);display:grid;place-items:center;padding:0 4px}
.gamecard{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.gamecard:hover{border-color:var(--accent)}
.res{font:700 .75rem var(--f-body);padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.res.win{background:var(--good-bg);color:var(--good);border-color:transparent}.res.loss{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.movelist{font-family:var(--f-mono);font-size:.88rem;line-height:1.9;overflow-wrap:anywhere}
.mn{color:var(--muted)}
.pair{white-space:nowrap;margin-right:6px}
.mv{font:inherit;border:0;background:transparent;color:var(--fg);padding:1px 4px;border-radius:4px;cursor:pointer}
.mv.on{background:var(--accent);color:var(--accent-fg)}
.empty{color:var(--muted);font-size:.95rem;padding:6px 0}
.toast{position:fixed;left:calc(50% + var(--rail,0px)/2);transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
/* Frage an den Trainer */
.fr-spalte{display:flex;flex-direction:column;gap:12px;min-width:0}
.fr-liste{display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin:12px 0 84px}
.fr-karte{gap:10px}
.fr-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fr-item{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.fr-karte>.fr-item:first-of-type{border-top:0;padding-top:0}
.fr-merk{font-size:.95rem;overflow-wrap:anywhere}
.fr-item summary,.fr-alt summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.fr-item summary:focus-visible,.fr-alt summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fr-wo{display:block;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-top:4px}
.fr-brett{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:168px;margin-top:8px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--sq-dark);font-family:var(--f-piece);line-height:1;user-select:none;-webkit-user-select:none}
.fr-brett i{position:relative;display:grid;place-items:center;aspect-ratio:1/1;min-width:0;overflow:hidden;font-style:normal;font-size:18px}
.fr-brett i.l{background:var(--sq-light)}.fr-brett i.d{background:var(--sq-dark)}
.fr-brett i.m::before{content:"";position:absolute;inset:0;background:var(--sq-hl)}
.fr-brett span{grid-area:1/1;position:relative}
.fr-w{color:#fbfaf6}.fr-s,.fr-o{color:#1b1f1c}
.fr-a{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:.97rem;line-height:1.5;overflow-wrap:anywhere}
.fr-a p{margin:0}
.fr-a ul{margin:0;padding-left:20px}
.fr-sf{margin:6px 0 0;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.fr-still{margin:0;color:var(--muted);font-size:.9rem}
.fr-tun{display:flex;gap:12px}
.fr-tun:empty{display:none}
.fr-link{font:inherit;font-size:.88rem;font-weight:600;color:var(--accent);background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:underline}
.fr-link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fr-leiste{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.fr-zeile{display:flex;gap:8px;align-items:stretch}
.fr-zeile input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.fr-zeile input::placeholder{color:var(--muted);opacity:1}
.fr-zeile input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fr-go{font:inherit;font-weight:600;font-size:.95rem;white-space:nowrap;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg)}
.fr-go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fr-hinweis{margin:0;padding:0 3px;font-size:.85rem;font-weight:600;color:var(--good)}
.fr-leiste{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
/* Fehler: Offen, Abgeschlossen, Übersicht */
.seg.drei button{flex:1 1 auto;min-width:0;padding:8px 5px;white-space:nowrap}
.seg small{font:500 .72rem var(--f-mono);opacity:.85}
.fx-gruppe{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.fx-gruppe[open]{border-color:var(--accent)}
.fx-gruppe>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;font-weight:700}
.fx-gruppe>summary::-webkit-details-marker{display:none}
.fx-gruppe>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.fx-gruppe>summary::after{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg)}
.fx-gruppe[open]>summary::after{transform:translateY(2px) rotate(225deg)}
.fx-frage{font-weight:600;overflow-wrap:anywhere}

htig ist 3.exd5, dazu das Grundreihenmatt nach 13.Te1.", "url": "https://claude.ai/artifact/TpextG1EcVzKd7hjFJCtS5", "tags": ["Weiß", "Niederlage"], "datum": "2026-10-31"}, {"id": "p-xph2", "gruppe": "partien", "titel": "vs XPheresX, Partie 2", "text": "Sieg mit Matt. Wieder 3…Sf6 statt 3…Lc5, hängender e5-Bauer und ein verpasstes Matt in 3.", "url": "https://claude.ai/artifact/GCp5AiNSo5X5Vtqz6emw9n", "tags": ["Schwarz", "Sieg"], "datum": "2026-10-31"}, {"id": "p-xph1", "gruppe": "partien", "titel": "vs XPheresX, Partie 1", "text": "Sieg mit Grundreihenmatt. 3…Sf6 statt 3…Lc5 und 7…O-O ließ e5 hängen.", "url": "https://claude.ai/artifact/TydrPHjgYZuLoL4afTUBaH", "tags": ["Schwarz", "Sieg"], "datum": "2026-10-31"}, {"id": "p-shs", "gruppe": "partien", "titel": "vs shs0226", "text": "Die wichtigsten Stellungen aus deiner Schottisch-Partie als Brett-Übungen.", "url": "https://claude.ai/artifact/96tMrxxeAmEnrFGg7z6cw9", "tags": ["Weiß"], "datum": "2026-10-29"}, {"id": "uebersicht", "gruppe": "plan", "titel": "Alte Übersichtsseite", "text": "Die frühere Übersicht aller Übungen. Ab jetzt ist diese App die Übersicht.", "url": "https://claude.ai/artifact/6aTqHzWkLmefUaG4T3ncF1", "tags": ["Archiv"], "datum": "2026-11-02"}, {"id": "lichess-w", "gruppe": "eroeffnung", "titel": "Lichess-Studie Repertoire Weiß", "text": "Alle Weiß-Linien mit Erklärungen: Schottisch, Elefantengambit, Alapin, Französisch, Caro-Kann und Skandinavisch, je Untervariante ein Kapitel.", "url": "https://lichess.org/study/5hn21Waj", "tags": ["Lichess"], "datum": "2026-11-04"}, {"id": "lichess-b", "gruppe": "eroeffnung", "titel": "Lichess-Studie Repertoire Schwarz", "text": "Alle Schwarz-Linien mit Erklärungen: 1…e5 mit Italienisch und Spanisch, Nimzo-Indisch, Bogo-Indisch und London, je Untervariante ein Kapitel.", "url": "https://lichess.org/study/6kfSby55", "tags": ["Lichess"], "datum": "2026-11-04"}], "schwaechen": [{"id": "lc5", "titel": "3…Lc5 im Italiener vergessen", "text": "Gegen 3.Lc4 spielst du 3…Lc5, nicht 3…Sf6.", "anzahl": 2}, {"id": "zaehlen", "titel": "Angreifer und Verteidiger nicht gezählt", "text": "e5 nach Te1 hängen lassen, e4 mit Sc3 nur einmal gedeckt.", "anzahl": 4}, {"id": "schach", "titel": "Schachs und Matt nicht zuerst geprüft", "text": "Matt in 3 verpasst, Grundreihenmatt übersehen, Dxe4+ zugelassen. Matt in 1 (De1#) verpasst vs sumithrakumar. Matt in 2 (Ta5+ Da4#) verpasst vs sa2te2.", "anzahl": 6}, {"id": "fessel", "titel": "Fesselung und Röntgen übersehen", "text": "Figur zieht weg und die Dame dahinter hängt.", "anzahl": 1}, {"id": "start", "titel": "Partiestart: Repertoire verlassen", "text": "Gegen Überraschungen wie 2…d5 oder 1…d5 nicht die bekannte Antwort gespielt (2.d4 statt 2.exd5). Gegen London …Sc6 statt …c5.", "anzahl": 4}, {"id": "nehmen", "titel": "Starke Schlag- und Fangzüge verpasst", "text": "7.Dxg7 und 8.b4 (Läuferfang) vs Almiraz1 nicht gesehen. Vor jedem Zug alle Schlagzüge prüfen.", "anzahl": 2}], "uebungen": [{"id": "u-lc5", "schwaeche": "lc5", "quelle": "vs XPheresX", "line": ["e4", "e5", "Nf3", "Nc6", "Bc4"], "frage": "Italienisch. Was ist dein Repertoirezug?", "antwort": ["Bc5"], "falsch": {"Nf6": "Das hast du zweimal gespielt. Es ist spielbar, aber nicht dein Repertoire. Dein Plan ist 3…Lc5 mit …d6 und …a6."}, "warum": "3…Lc5: Der Läufer stellt sich aktiv auf die Diagonale nach f2. Danach 4.c3 Sf6 5.d3 d6 6.O-O a6.", "seite": "b"}, {"id": "u-te1", "schwaeche": "zaehlen", "quelle": "Spanisch", "line": ["e4", "e5", "Nf3", "Nc6", "Bb5", "a6", "Ba4", "Nf6", "O-O", "Be7", "Re1"], "frage": "Weiß hat Te1 gespielt. Was droht, und was spielst du?", "antwort": ["b5"], "ok": {"d6": "Deckt e5 auch, aber dein Repertoirezug ist 6…b5 und 7…d6."}, "falsch": {"O-O": "Genau dein Muster aus der Partie: Nach 7.Lxc6 dxc6 8.Sxe5 ist e5 weg, und du musst mit …Dd4 tricksen, um ihn zurückzuholen."}, "warum": "Te1 droht Lxc6 und danach Sxe5. Mit 6…b5 jagst du den Läufer weg, dann 7.Lb3 d6 und e5 ist gedeckt.", "seite": "b"}, {"id": "u-eleph", "schwaeche": "start", "quelle": "vs JackBlackPieces", "line": ["e4", "e5", "Nf3", "d5"], "frage": "Elefantengambit. Was ist die beste Antwort?", "antwort": ["exd5"], "falsch": {"Nxe5": "Das hast du gespielt. Es geht, aber nach 3.exd5 steht Weiß einfacher besser."}, "warum": "3.exd5 nimmt den Bauern. Auf 3…e4 kommt 4.De2, auf 3…Dxd5 4.Sc3 mit Tempo gegen die Dame.", "seite": "w"}, {"id": "u-eleph2", "schwaeche": "start", "quelle": "Elefantengambit", "line": ["e4", "e5", "Nf3", "d5", "exd5", "e4"], "frage": "Schwarz greift deinen Springer mit e4 an. Was spielst du?", "antwort": ["Qe2"], "warum": "4.De2 fesselt den e4-Bauern an den König e8 und greift ihn an. Der Springer muss nicht weg.", "seite": "w"}, {"id": "u-ba6", "schwaeche": "fessel", "quelle": "Schottisch Variante A", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Nf6", "Nxc6", "bxc6", "e5", "Qe7", "Qe2", "Nd5", "c4"], "frage": "Du spielst Weiß, aber kenn die Idee von Schwarz: Mit welchem Läuferzug fesselt Schwarz deinen c4-Bauern?", "antwort": ["Ba6"], "warum": "8…La6: Der Läufer greift c4 an, dahinter steht die De2. Als Weiß spielst du deshalb 9.b3.", "seite": "w"}, {"id": "u-dxe4", "schwaeche": "schach", "quelle": "vs shs0226", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Bb4+", "c3", "Bc5", "Nb3", "Qf6", "Nxc5", "d6", "Nb3", "Qe5", "c4"], "frage": "Nach deinem 9.c4 ist Schwarz am Zug. Welcher Zug gewinnt deinen Bauern mit Schach? Zieh für Schwarz.", "antwort": ["Qxe4+"], "warum": "9…Dxe4+ schlägt e4 mit Schach auf der e-Linie. Merksatz: Steht die Dame auf der e-Linie, immer Schachs prüfen.", "seite": "w"}, {"id": "u-ld3", "schwaeche": "zaehlen", "quelle": "vs shs0226", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Bb4+", "c3", "Bc5", "Nb3", "Qf6", "Nxc5", "d6", "Nb3", "Qe5"], "frage": "Die De5 greift e4 an. Wie deckst du ihn und entwickelst dabei?", "antwort": ["Bd3"], "falsch": {"c4": "Das hast du gespielt. Danach geht 9…Dxe4+ mit Schach."}, "warum": "9.Ld3 deckt e4 und bringt eine Figur ins Spiel.", "seite": "w"}, {"id": "u-f3", "schwaeche": "zaehlen", "quelle": "vs shs0226", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Bb4+", "c3", "Bc5", "Nb3", "Qf6", "Nxc5", "d6", "Nb3", "Qe5", "c4", "Nf6"], "frage": "De5 und Sf6 greifen e4 an. Wie hältst du ihn sicher?", "antwort": ["f3"], "falsch": {"Bd3": "Zähle nach: Nach 10…Sxe4 11.Lxe4 Dxe4+ ist der Bauer trotzdem weg.", "Nc3": "Das hast du gespielt. Zwei Angreifer, ein Verteidiger: 10…Sxe4 gewinnt den Bauern."}, "warum": "Zähle: zwei Angreifer auf e4. 10.f3 deckt mit einem Bauern, Schlagen kostet Schwarz dann eine Figur.", "seite": "w"}, {"id": "u-grund", "schwaeche": "schach", "quelle": "Grundreihe", "fen": "6k1/5ppp/8/8/8/8/r4PPP/3R2K1 w - - 0 1", "frage": "Weiß am Zug. Prüfe zuerst alle Schachs.", "antwort": ["Rd8#"], "warum": "Td8 ist Matt: Der König kann nicht weg, weil f7, g7 und h7 ihm die Fluchtfelder nehmen. Darum vor jedem Zug die eigene Grundreihe prüfen.", "seite": "w"}, {"id": "u-grund2", "schwaeche": "schach", "quelle": "Grundreihe wie vs JackBlackPieces", "fen": "3r2k1/pp3ppp/8/2N5/8/8/PP3PPP/6K1 w - - 0 1", "frage": "Weiß am Zug. Was droht Schwarz, und wie verhinderst du es?", "antwort": ["h3", "g3", "h4", "g4", "f3", "f4", "Kf1"], "ok": {"Nd3": "Hält im Moment, weil Se1 blocken kann. Ein Luftloch ist aber dauerhaft sicher."}, "falsch": {"Nd7": "Blockt zwar die d-Linie, aber nach …Txd7 ist der Springer weg."}, "warum": "Schwarz droht Td1 matt. Ein Luftloch wie h3 oder g3 gibt deinem König ein Fluchtfeld, dann ist Td1+ kein Matt mehr.", "seite": "w"}, {"id": "u-skan-start", "schwaeche": "start", "quelle": "vs JacopoCa81", "line": ["e4", "d5"], "frage": "Schwarz spielt 1…d5 und greift e4 an. Was ist dein Repertoirezug?", "antwort": ["exd5"], "falsch": {"d4": "Dein Partiezug. Nach 2…dxe4 ist dein Bauer weg. Das ist ein Gambit (Blackmar-Diemer), nicht dein Repertoire.", "e5": "Vorstoß ist gegen 1…d5 nicht dein Plan. Nimm einfach den Bauern."}, "warum": "2.exd5 Dxd5 3.Sc3: Du nimmst den Bauern, der dich angreift, und jagst die Dame danach mit Tempo.", "seite": "w"}, {"id": "u-skan-dame", "schwaeche": "zaehlen", "quelle": "vs JacopoCa81", "line": ["e4", "d5", "d4", "dxe4", "Nc3", "Qxd4"], "frage": "Schwarz hat 3…Dxd4 gespielt. Was hast du in der Partie übersehen?", "antwort": ["Qxd4"], "ok": {"Bb5+": "Gewinnt auch die Dame (3…Dd7 4.Lxd7+), aber 4.Dxd4 ist einfacher."}, "falsch": {"Be3": "Dein Partiezug. Danach kann Schwarz die Damen tauschen und hat einen Bauern mehr."}, "warum": "Die schwarze Dame auf d4 ist von keiner Figur gedeckt. Deine Dame d1 sieht sie über die offene d-Linie. Erste Frage bei jedem Zug: Hat der Gegner etwas ungedeckt hingestellt?", "seite": "w"}, {"id": "u-skan-b2", "schwaeche": "zaehlen", "quelle": "vs JacopoCa81", "line": ["e4", "d5", "d4", "dxe4", "Nc3", "Qxd4", "Be3", "Qb4", "a3", "Qxb2"], "frage": "Die schwarze Dame hat b2 geschlagen und steht tief in deinem Lager. Wie bestrafst du das?", "antwort": ["Nd5", "Nb5"], "ok": {"Bb5+": "Dein Partiezug, gar nicht schlecht. Aber mit dem Springer ist es viel stärker."}, "warum": "6.Sd5! droht Sxc7+ mit Gabel auf König und Ta8. Nach 6…De5 7.Lf4 hat die Dame kein Feld mehr und geht verloren. Eine Dame, die Bauern frisst, kann man oft jagen oder fangen.", "seite": "w"}, {"id": "u-skan-dd3", "schwaeche": "schach", "quelle": "vs JacopoCa81", "line": ["e4", "d5", "d4", "dxe4", "Nc3", "Qxd4", "Be3", "Qb4", "a3", "Qxb2", "Bb5+", "c6"], "frage": "Die Dame b2 schaut auf Sc3 und Ta1, der Lb5 wird angegriffen. Was spielst du?", "antwort": ["Nge2"], "ok": {"Nd5": "Spielbar. 7.Sge2 ist sicherer, weil es c3 deckt.", "Bd4": "Spielbar, aber 7.Sge2 deckt den Springer c3 und macht alles sicher."}, "falsch": {"Qd3": "Dein Partiezug: Der Bauer e4 schlägt die Dame (…exd3), und …Dxa1+ wäre auch noch Schach. Nie die Dame auf ein Feld, das ein Bauer angreift.", "Qd2": "Dann kommt …Dxa1+ mit Schach. Erst Schachs des Gegners prüfen!"}, "warum": "7.Sge2 deckt den Sc3 ein zweites Mal. Nimmt Schwarz 7…cxb5, kommt 8.Sd5 mit der Drohung Sc7+, und die schwarze Dame steht weit weg vom Geschehen.", "seite": "w"}, {"id": "u-prat-e5", "schwaeche": "start", "quelle": "vs Pratyax_3008", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Nxd4", "Qxd4", "Nf6"], "frage": "Schwarz hat 4…Sxd4 und 5…Sf6 gespielt. Deine Dame steht zentral auf d4. Was ist am stärksten?", "antwort": ["e5"], "ok": {"Nc3": "Solide Entwicklung, aber 6.e5 ist stärker: Der Springer f6 muss sofort wieder weg."}, "falsch": {"Bc4": "Entwickelt, aber Schwarz hat Ruhe. 6.e5 vertreibt den Springer mit Tempo und gewinnt Raum."}, "warum": "6.e5 (dein Partiezug, Engine-Bestzug) gewinnt Raum und Tempo: Der Sf6 hat kein gutes Feld. 5…Df6 wäre für Schwarz besser gewesen.", "seite": "w"}, {"id": "u-prat-lc4", "schwaeche": "schach", "quelle": "vs Pratyax_3008", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Nxd4", "Qxd4", "Nf6", "e5", "c5", "Qf4", "Nd5", "Qf3", "Ne7"], "frage": "Schwarz hat 8…Se7 gespielt und damit seinen Läufer f8 eingesperrt. Welcher Zug droht sofort Matt?", "antwort": ["Bc4"], "ok": {"Bf4": "Guter Entwicklungszug, aber 9.Lc4 ist viel stärker: Es droht Dxf7#."}, "falsch": {"Qxf7+": "Zu früh: Kxf7, und die Dame ist weg. Erst den Läufer auf c4 als Helfer holen."}, "warum": "9.Lc4 (dein Partiezug) droht Dxf7#: Der König e8 hat kein Fluchtfeld, weil Dd8, Lf8, Se7 und d7 ihn einmauern. Merke: Steht f7 nur vom König gedeckt, Dame + Läufer auf f7 richten.", "seite": "w"}, {"id": "u-prat-matt", "schwaeche": "schach", "quelle": "vs Pratyax_3008", "line": ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Nxd4", "Qxd4", "Nf6", "e5", "c5", "Qf4", "Nd5", "Qf3", "Ne7", "Bc4", "f6", "exf6", "gxf6", "Qxf6", "Rg8"], "frage": "Schwarz hat 11…Tg8 gespielt. Finde den schnellsten Gewinn.", "antwort": ["Qf7#", "Bf7#"], "ok": {}, "falsch": {"Bxg8": "Gewinnt einen Turm, aber es gibt Matt in 1. Immer zuerst Schachs prüfen!", "Qxe7+": "Die Dame wird einfach mit …Lxe7 geschlagen. Es gibt Matt in 1."}, "warum": "12.Df7# (dein Partiezug) oder 12.Lf7#: Der König ist eingemauert. Besser für Schwarz wäre 11…d5 gewesen, dann 12.Dxh8 mit Mehrturm für dich.", "seite": "w"}, {"id": "u-sumi-f7", "schwaeche": "start", "quelle": "vs sumithrakumar", "line": ["e4", "e5", "Qf3", "Nc6", "Bc4"], "frage": "Weiß spielt 2.Df3 und 3.Lc4. Was droht, und wie verteidigst du?", "antwort": ["Nf6"], "ok": {"Qf6": "Geht auch (Engine-Favorit): Damen gegenüber, f7 gedeckt.", "Qe7": "Deckt f7, aber die Dame stellt den Lf8 zu. 3…Sf6 ist natürlicher.", "Nh6": "Deckt f7, aber der Springer steht am Rand. Besser 3…Sf6.", "f5": "Blockiert die Dame, ist aber sehr riskant."}, "falsch": {"Bc5": "4.Dxf7# – Matt! Lc5 ist hier falsch, weil die Dame schon auf f3 steht.", "Nd4": "Greift die Dame an, aber 4.Dxf7# ist Matt.", "d6": "4.Dxf7# – Matt.", "Be7": "4.Dxf7# – Matt."}, "warum": "Dame f3 + Läufer c4 zielen auf f7: es droht Dxf7#. 3…Sf6 (dein Partiezug) stellt den Springer dazwischen und entwickelt. Merke: Gegen frühe Dame immer zuerst f7 prüfen, erst dann dein Repertoire-Zug.", "seite": "b"}, {"id": "u-sumi-lxh3", "schwaeche": "zaehlen", "quelle": "vs sumithrakumar", "line": ["e4", "e5", "Qf3", "Nc6", "Bc4", "Nf6", "d3", "d6", "Nh3", "Bg4", "Qe3", "d5", "Bb3", "d4", "Qd2", "Bb4", "c3", "dxc3", "bxc3", "Ba5", "f3"], "frage": "Weiß hat 11.f3 gespielt und greift deinen Lg4 an. Was ist der beste Zug?", "antwort": ["Bxh3"], "ok": {}, "falsch": {"Be6": "Dein Partiezug: 12.Lxe6 fxe6, und dein großer Vorteil (+2) ist weg.", "Bh5": "Der Läufer steht passiv, Weiß spielt Sa3–c4. Vorteil weg.", "Bd7": "Rückzug, ausgeglichen. Es gibt Besseres.", "Bc8": "Rückzug, ausgeglichen. Es gibt Besseres."}, "warum": "11…Lxh3! 12.gxh3: Der Läufer muss sowieso weg, also tauscht er sich gegen den Springer, den nur g2 deckt. Weiß hat dann Doppelbauern h2/h3, einen offenen König und d3 hängt nach …Dd7. Merke: Angegriffene Figur? Erst schauen, ob sie etwas Nützliches schlagen kann, bevor du zurückziehst.", "se /* ---------- Server: Speicher und KI ----------
   Ersetzt die Claude-Schnittstellen: Fortschritt, Chat und Analysen liegen auf dem eigenen Server,
   KI-Fragen gehen an ein kostenloses Modell (NVIDIA, sonst Gemini). */
const SERVER=(()=>{
  const KEY="schach-zugang";
  try{ const m=location.hash.match(/^#k=([A-Za-z0-9_-]{16,})/); if(m){localStorage.setItem(KEY,m[1]); history.replaceState(null,"",location.pathname+"#heute")} }catch(e){}
  const token=()=>{try{return localStorage.getItem(KEY)||""}catch(e){return ""}};
  const setToken=t=>{try{t?localStorage.setItem(KEY,t):localStorage.removeItem(KEY)}catch(e){}};
  const fehler=(code,extra)=>Object.assign({code},extra||{});
  async function req(method,path,body,signal,extra){
    let r;
    const headers=Object.assign({"Authorization":"Bearer "+token()},extra||{}); if(body!==undefined) headers["Content-Type"]="application/json";
    try{ r=await fetch(path,{method,headers,body:body===undefined?undefined:(typeof body==="string"?body:JSON.stringify(body)),signal,cache:"no-store"}) }
    catch(e){ if(e&&e.name==="AbortError") throw fehler("cancelled"); throw fehler("offline") }
    if(r.status===401) throw fehler("not_granted");
    if(r.status===429) throw fehler("rate_limited");
    return r;
  }
  const name=p=>encodeURIComponent(String(p).split("/").pop());
  async function get(n){const r=await req("GET","/api/doc/"+name(n));if(r.status===404)return null;if(!r.ok)throw fehler("server");return (await r.json()).data}
  async function put(n,data){const r=await req("PUT","/api/doc/"+name(n),JSON.stringify(data));if(!r.ok)throw fehler("server",{status:r.status})}
  async function del(n){const r=await req("DELETE","/api/doc/"+name(n));if(!r.ok&&r.status!==404)throw fehler("server")}
  /* Mit Versionsnummer, damit sich zwei Geräte nichts überschreiben.
     getRev: {rev,data} oder {rev,gleich:true}, wenn sich seit rev nichts getan hat. null, wenn es das Dokument nicht gibt.
     putRev: speichert nur, wenn auf dem Server noch rev liegt. Sonst Fehler "konflikt" mit dem Stand vom Server. */
  async function getRev(n,rev){const r=await req("GET","/api/doc/"+name(n),undefined,undefined,rev!=null?{"X-Rev":String(rev)}:null);if(r.status===404)return null;if(!r.ok)throw fehler("server");return r.json()}
  async function putRev(n,data,rev){
    const r=await req("PUT","/api/doc/"+name(n),JSON.stringify(data),undefined,rev!=null?{"X-Rev":String(rev)}:null);
    if(r.status===409){let j={};try{j=await r.json()}catch(e){} throw fehler("konflikt",{rev:j.rev||0,data:j.data==null?null:j.data})}
    if(!r.ok)throw fehler("server",{status:r.status});
    return r.json();
  }
  const doc=p=>({get:async()=>{const d=await get(p);return {exists:d!=null,data:()=>d}},set:d=>put(p,d),delete:()=>del(p)});
  async function pruefe(t){const r=await fetch("/api/pruefen",{headers:{"Authorization":"Bearer "+t},cache:"no-store"});return r.ok}
  /* Gesprächsverlauf so formen, dass jedes Modell ihn annimmt: abwechselnd user/assistant, Start mit user */
  function nachrichten(input){
    const roh=typeof input==="string"?[{role:"user",content:input}]:(input||[]).map(x=>({role:x.role==="assistant"?"assistant":"user",content:String(x.content||"")}));
    const out=[]; for(const m of roh){const l=out[out.length-1]; if(l&&l.role===m.role) l.content+="\n\n"+m.content; else out.push({role:m.role,content:m.content})}
    while(out.length&&out[0].role!=="user") out.shift();
    return out;
  }
  const ohneDenken=s=>s.replace(/<think>[\s\S]*?(<\/think>|$)/g,"").replace(/^\s+/,"");
  async function frage(input,opt){
    opt=opt||{}; let text="", roh="", truncated=false;
    const r=await req("POST","/api/frage",{messages:nachrichten(input),json:!!opt.json},opt.signal);
    if(!r.ok){let d=[];try{d=(await r.json()).fehlversuche||[]}catch(e){} throw fehler(r.status===503?"anbieter":"server",{detail:d})}
    const modell=r.headers.get("X-Modell")||"";
    const reader=r.body.getReader(), dec=new TextDecoder(); let puffer="";
    try{
      for(;;){
        const {done,value}=await reader.read(); if(done) break;
        puffer+=dec.decode(value,{stream:true});
        let i; while((i=puffer.indexOf("\n"))>=0){
          const z=puffer.slice(0,i).trim(); puffer=puffer.slice(i+1);
          if(!z.startsWith("data:")) continue; const d=z.slice(5).trim(); if(!d||d==="[DONE]") continue;
          let j; try{j=JSON.parse(d)}catch(e){continue}
          const c=j.choices&&j.choices[0]; if(!c) continue;
          if(c.delta&&typeof c.delta.content==="string"&&c.delta.content){roh+=c.delta.content; text=ohneDenken(roh); if(opt.onText&&text) opt.onText({text})}
          if(c.finish_reason==="length") truncated=true;
        }
      }
    }catch(e){ if(opt.signal&&opt.signal.aborted) throw fehler("cancelled",{text}); throw fehler("server",{text}) }
    if(opt.signal&&opt.signal.aborted) throw fehler("cancelled",{text});
    if(!text.trim()) throw fehler("leer");
    return {text,truncated,modell};
  }
  const sample=(input,opt)=>frage(input,opt);
  sample.limits=async()=>({tools:false});
  sample.json=async(prompt,opt)=>{
    const r=await frage(prompt+"\n\nWichtig: Gib NUR das JSON-Objekt aus, ohne Codeblock und ohne Text davor oder danach.",Object.assign({},opt,{json:true}));
    const s=r.text.replace(/```(?:json)?/gi,"").trim(), a=s.indexOf("{"), b=s.lastIndexOf("}");
    if(a<0||b<=a) throw fehler("invalid_json");
    try{return JSON.parse(s.slice(a,b+1))}catch(e){throw fehler("invalid_json")}
  };
  return {token,setToken,pruefe,get,put,del,doc,getRev,putRev,sample,roh:req};
})();

function zeigeZugang(){
  if(document.getElementById("zugang")) return;
  const hat=!!SERVER.token();
  const el=document.createElement("div"); el.id="zugang"; el.className="zg";
  el.innerHTML=`<div class="zg-box" role="dialog" aria-modal="true" aria-labelledby="zg-t"><h2 id="zg-t">Zugang zum Server</h2>
   <p class="small muted">Den Zugangscode hat dir Claude im Chat gegeben. Einmal eingeben reicht, danach merkt sich die App ihn.</p>
   <input type="text" id="zg-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Zugangscode" aria-label="Zugangscode">
   <p class="small" id="zg-msg" hidden></p>
   <div class="row"><button class="btn p" type="button" id="zg-ok">Verbinden</button><button class="btn" type="button" id="zg-zu">${hat?"Schließen":"Später"}</button>${hat?'<button class="btn" type="button" id="zg-weg">Code entfernen</button>':""}</div>
   ${hat?`<div class="zg-mehr"><b>Weiteres Gerät verbinden</b><p class="small muted">Tablet oder zweites Handy: dort die App installieren und diesen Code eingeben. Beide Geräte teilen sich dann denselben Fortschritt.</p>
    <div class="row"><button class="btn s" type="button" id="zg-zeig">Code anzeigen</button><button class="btn s" type="button" id="zg-kop" hidden>Kopieren</button></div><div class="zg-code" id="zg-code" hidden></div></div>`:""}</div>`;
  document.body.appendChild(el);
  const inp=$("#zg-in"), msg=$("#zg-msg"), zu=()=>el.remove();
  setTimeout(()=>{try{inp.focus()}catch(e){}},60);
  $("#zg-zu").onclick=zu;
  const weg=$("#zg-weg"); if(weg) weg.onclick=()=>{SERVER.setToken("");basisWeg();zu();setSync("err","Kein Zugang");toast("Code entfernt")};
  const zeig=$("#zg-zeig"); if(zeig) zeig.onclick=()=>{
    const c=$("#zg-code"), auf=c.hidden; c.hidden=!auf; $("#zg-kop").hidden=!auf; zeig.textContent=auf?"Code verbergen":"Code anzeigen";
    /* in Vierergruppen, damit er sich leichter abtippen lässt. Leerzeichen sind beim Eingeben egal */
    if(auf) c.textContent=(SERVER.token().match(/.{1,4}/g)||[]).join(" ");
  };
  const kop=$("#zg-kop"); if(kop) kop.onclick=async()=>{ try{await navigator.clipboard.writeText(SERVER.token());toast("Code kopiert")}catch(e){toast("Kopieren geht hier nicht. Tipp den Code ab.")} };
  $("#zg-ok").onclick=async()=>{
    const code=inp.value.replace(/\s+/g,""); if(!code) return;
    msg.hidden=false; msg.textContent="Prüfe …";
    let ok=false; try{ok=await SERVER.pruefe(code)}catch(e){msg.textContent="Keine Verbindung zum Server. Prüf dein Internet.";return}
    if(!ok){msg.textContent="Der Code stimmt nicht. Achte auf Groß- und Kleinschreibung.";return}
    if(code!==SERVER.token()){basisWeg();stateGeladen=false}
    SERVER.setToken(code); zu(); toast("Verbunden"); await initStore(); syncData(false); setTimeout(()=>{partienPflegen();ccHole(false)},2500);
  };
  inp.onkeydown=e=>{if(e.key==="Enter")$("#zg-ok").click()};
}

/* ---------- Abgleich zwischen Geräten ----------
   Handy und Tablet teilen sich denselben Fortschritt auf dem Server. Jedes Speichern nennt die Version,
   auf der es aufbaut. Hat das andere Gerät inzwischen gespeichert, lehnt der Server ab und schickt seinen
   Stand. Dann werden beide Stände zusammengeführt (verschmelze) und noch einmal gespeichert. So geht auf
   keinem Gerät etwas verloren. "basis" ist der Stand, den dieses Gerät zuletzt mit dem Server geteilt hat. */
const REV={state:{rev:null,basis:null},chat:{rev:null,basis:null}};
const istObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const kopie=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
/* tiefer Vergleich, die Reihenfolge der Schlüssel ist egal */
function gl(a,b){
  if(a===b) return true;
  if(a==null||b==null||typeof a!=="object"||typeof b!=="object") return false;
  const aa=Array.isArray(a); if(aa!==Array.isArray(b)) return false;
  if(aa){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(!gl(a[i],b[i])) return false; return true }
  const ka=Object.keys(a); if(ka.length!==Object.keys(b).length) return false;
  for(const k of ka) if(!Object.prototype.hasOwnProperty.call(b,k)||!gl(a[k],b[k])) return false;
  return true;
}
const stabil=x=>JSON.stringify(x,(k,v)=>istObj(v)?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v);
const mKey=x=>istObj(x)&&x.id!=null?"i:"+x.id:"j:"+stabil(x);
/* b = gemeinsamer Ausgangsstand, l = dieses Gerät, r = Server. Was nur eine Seite geändert hat, gilt.
   Haben beide dasselbe Feld verschieden geändert, gewinnt dieses Gerät. */
function verschmelze(b,l,r){
  if(gl(l,r)) return l;
  if(gl(l,b)) return r;
  if(gl(r,b)) return l;
  if(Array.isArray(l)&&Array.isArray(r)) return verschmelzeListe(Array.isArray(b)?b:[],l,r);
  if(istObj(l)&&istObj(r)){
    const bo=istObj(b)?b:{}, out={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
      const inL=k in l, inR=k in r, inB=k in bo;
      if(inL&&inR) out[k]=verschmelze(bo[k],l[k],r[k]);
      else if(inL){ if(!(inB&&gl(l[k],bo[k]))) out[k]=l[k] }   /* drüben gelöscht, hier unverändert: bleibt gelöscht */
      else if(!(inB&&gl(r[k],bo[k]))) out[k]=r[k];              /* hier gelöscht, drüben unverändert: bleibt gelöscht */
    }
    return out;
  }
  return l;
}
function verschmelzeListe(b,l,r){
  const kb=b.map(mKey), kl=l.map(mKey), kr=r.map(mKey), eind=k=>new Set(k).size===k.length;
  if(!eind(kl)||!eind(kr)||!eind(kb)){
    /* Listen mit Wiederholungen (der Chat): nur zusammenführen, wenn beide Seiten bloß angehängt haben */
    const vorn=x=>x.length>=b.length&&b.every((e,i)=>gl(e,x[i]));
    return vorn(l)&&vorn(r)?[...b,...r.slice(b.length),...l.slice(b.length)]:l;
  }
  const B=new Map(b.map((x,i)=>[kb[i],x])), L=new Set(kl), R=new Map(r.map((x,i)=>[kr[i],x])), out=[];
  let alt=0;   /* bis hierhin reicht in out, was es schon im Ausgangsstand gab */
  l.forEach((x,i)=>{const k=kl[i];
    if(R.has(k)) out.push(verschmelze(B.get(k),x,R.get(k)));
    else if(!B.has(k)||!gl(x,B.get(k))) out.push(x);            /* neu auf diesem Gerät, oder drüben gelöscht, aber hier geändert */
    else return;
    if(B.has(k)) alt=out.length;
  });
  const erstB=kr.findIndex(k=>B.has(k)), vorne=[], hinten=[];
  r.forEach((x,i)=>{const k=kr[i];
    if(L.has(k)||(B.has(k)&&gl(x,B.get(k)))) return;            /* schon drin, oder hier gelöscht und drüben unverändert */
    (erstB>=0&&i<erstB?vorne:hinten).push(x);
  });
  /* Neues vom Server kommt vor das Neue von diesem Gerät: es wurde früher gespeichert */
  const erg=[...vorne,...out.slice(0,alt),...hinten,...out.slice(alt)];
  const sortiert=a=>a.every((x,i)=>typeof x==="string"&&(i===0||a[i-1]<=x));
  if(l.length&&r.length&&sortiert(l)&&sortiert(r)) erg.sort();
  return erg;
}
/* ziel bekommt den Inhalt von quelle, ohne dass ziel und seine Teile neue Objekte werden.
   So bleiben Verweise gültig, die eine laufende Übung noch auf Teile des Fortschritts hält. */
function angleichen(z,q){
  if(Array.isArray(z)){
    const alt=new Map(); z.forEach(x=>{if(istObj(x)&&x.id!=null) alt.set("i:"+x.id,x)});
    const neu=q.map(x=>{const a=istObj(x)&&x.id!=null?alt.get("i:"+x.id):null; return a?angleichen(a,x):x});
    z.length=0; for(const x of neu) z.push(x); return z;
  }
  for(const k of Object.keys(z)) if(!(k in q)) delete z[k];
  for(const k of Object.keys(q)){
    const a=z[k], b=q[k];
    if((istObj(a)&&istObj(b))||(Array.isArray(a)&&Array.isArray(b))) angleichen(a,b); else z[k]=b;
  }
  return z;
}
/* Dieselbe Partie, auf zwei Geräten gleichzeitig geholt, hat zwei Kennungen. Eine bleibt, die andere geht mit ihrem Anhang. */
function entdoppeln(){
  const gs=S.games||[]; if(gs.length<2) return false;
  const gruppen=new Map(); for(const g of gs){const k=zugKey(g.pgn); if(!gruppen.has(k)) gruppen.set(k,[]); gruppen.get(k).push(g)}
  const weg=new Map(), ana=new Set(S.anaIds||[]), aufg=(S.auto&&S.auto.aufg)||{};
  for(const liste of gruppen.values()){
    if(liste.length<2) continue;
    const rang=g=>(ana.has(g.id)?0:aufg[g.id]!=null?1:2);
    const bleibt=liste.slice().sort((a,b)=>rang(a)-rang(b)||(a.id<b.id?-1:1))[0];
    for(const g of liste) if(g!==bleibt) weg.set(g.id,bleibt.id);
  }
  if(!weg.size) return false;
  S.games=gs.filter(g=>!weg.has(g.id));
  S.anaIds=(S.anaIds||[]).filter(id=>!weg.has(id));
  for(const o of [S.rep,S.auto&&S.auto.aufg,S.auto&&S.auto.fehl]) if(o) for(const id of weg.keys()) delete o[id];
  S.custom=(S.custom||[]).filter(c=>{
    if(!weg.has(c.gameId)) return true;
    if(c.auto){delete S.srs[c.id];delete S.fertig[c.id];return false}   /* die Aufgaben der Partie, die bleibt, gibt es schon oder sie entstehen neu */
    c.gameId=weg.get(c.gameId); return true;
  });
  return true;
}
const basisMerken=w=>lsSet("schach-basis-"+w,{rev:REV[w].rev,d:REV[w].basis});
const basisWeg=()=>["state","chat"].forEach(w=>{lsDel("schach-basis-"+w);lsDel("schach-offen-"+w)});
/* Stand vom Server in den Stand dieses Geräts einarbeiten. anders: hier hat sich etwas getan. offen: es gibt noch etwas hochzuladen. */
function uebernimm(which,rev,fern){
  const R=REV[which], lokal=which==="state"?S:C;
  const neu=Object.assign(which==="state"?kopie(BLANK):{turns:[]},kopie(gl(lokal,R.basis)?fern:verschmelze(R.basis,lokal,fern)));
  const anders=!gl(lokal,neu);
  angleichen(lokal,neu);
  R.rev=rev; R.basis=kopie(fern); basisMerken(which);
  if(which==="state") entdoppeln();
  lsSet(which==="state"?"schach-state":"schach-chat",lokal);
  return {anders,offen:!gl(lokal,R.basis)};
}
/* Speichern und Abgleichen laufen nie gleichzeitig */
let kette=Promise.resolve();
const gesperrt=fn=>{const p=kette.then(fn,fn); kette=p.catch(()=>{}); return p};
async function hochladen(which){
  const R=REV[which];
  for(let i=0;i<5;i++){
    const jetzt=kopie(which==="state"?S:C);
    if(R.rev!=null&&gl(jetzt,R.basis)){lsDel("schach-offen-"+which);return}
    try{
      const r=await SERVER.putRev(which,jetzt,R.rev);
      R.rev=r.rev; R.basis=jetzt; basisMerken(which);
      if(gl(which==="state"?S:C,jetzt)) lsDel("schach-offen-"+which);
      return;
    }catch(e){
      if(!(e&&e.code==="konflikt")) throw e;
      if(e.data==null){R.rev=e.rev||0;R.basis=null;continue}
      if(uebernimm(which,e.rev,e.data).anders) nachAbgleich();
    }
  }
  throw {code:"konflikt"};
}
async function sichere(which){
  clearTimeout(pendingSave[which]); pendingSave[which]=0;
  if(saving[which]){pendingSave[which]=setTimeout(()=>sichere(which),600);return}
  saving[which]=true;
  try{ await gesperrt(()=>hochladen(which)); saveErr=0 }
  catch(e){ console.warn("save",e); if(!saveErr++) toast("Speichern auf dem Server fehlgeschlagen ("+((e&&e.code)||"Fehler")+"). Auf diesem Gerät ist es trotzdem gemerkt.") }
  saving[which]=false;
}
function persist(which){
  if(which==="state") lsSet("schach-state",S); else lsSet("schach-chat",C);
  lsSet("schach-offen-"+which,1);
  const doc = which==="state"?stateDoc:chatDoc; if(!doc) return;
  clearTimeout(pendingSave[which]);
  pendingSave[which]=setTimeout(()=>sichere(which),700);
}
const save = () => persist("state");
const saveChat = () => persist("chat");
/* nach einem Abgleich, der hier etwas geändert hat: neu zeichnen, aber niemandem die Eingabe wegnehmen */
function nachAbgleich(){
  try{partienPflegen()}catch(e){}
  const a=document.activeElement, tippt=a&&/^(TEXTAREA|SELECT)$/.test(a.tagName)||(a&&a.tagName==="INPUT"&&a.type!=="checkbox");
  if(!tippt&&!B&&!review&&!document.getElementById("zugang")) render();
  toast("Stand vom anderen Gerät übernommen");
}
/* Hat das andere Gerät gespeichert? Dann dessen Stand holen und einarbeiten. */
let abglZeit=0, ladeLaeuft=false;
async function abgleich(sofort){
  if(!SERVER.token()) return;
  if(!stateGeladen){ if(!ladeLaeuft&&!document.getElementById("zugang")) await initStore(); return }   /* der Start war ohne Netz: Laden nachholen */
  if(!sofort&&Date.now()-abglZeit<8000) return;
  abglZeit=Date.now();
  try{
    await gesperrt(async()=>{
      let neu=false;
      const a=await SERVER.getRev("state",REV.state.rev);
      if(a&&!a.gleich){const u=uebernimm("state",a.rev,a.data); neu=u.anders; if(u.offen) persist("state")}
      if(!busy){
        const b=await SERVER.getRev("chat",REV.chat.rev);
        if(b&&!b.gleich){const u=uebernimm("chat",b.rev,b.data); neu=neu||u.anders; if(u.offen) persist("chat")}
      }
      if(neu) nachAbgleich();
    });
  }catch(e){ if(e&&e.code==="not_granted") zeigeZugang() }
}
/* Beim Start: Stand vom Server laden. Was beim letzten Mal nicht mehr hochkam (kein Netz, App zu früh zu), wird eingearbeitet. */
function ladeDoc(which,fern){
  const R=REV[which], lokal=which==="state"?S:C;
  if(!fern){ R.rev=0; R.basis=null; return false }
  const alt=lsGet("schach-basis-"+which,null), offen=lsGet("schach-offen-"+which,0);
  const neu=Object.assign(which==="state"?kopie(BLANK):{turns:[]},kopie(offen&&alt&&alt.d&&!gl(lokal,alt.d)?verschmelze(alt.d,lokal,fern.data):fern.data));
  if(which==="state") S=neu; else C=neu;
  R.rev=fern.rev; R.basis=kopie(fern.data); basisMerken(which);
  if(which==="state") entdoppeln();
  lsSet(which==="state"?"schach-state":"schach-chat",neu);
  if(gl(neu,R.basis)) lsDel("schach-offen-"+which); else persist(which);
  return true;
}
async function initStore(){
  if(!SERVER.token()||ladeLaeuft) return;
  ladeLaeuft=true;
  try{
    const db = SERVER, id = "ich";
    anaDb = db; anaUid = id;
    const [a,b] = await Promise.all([SERVER.getRev("state"),SERVER.getRev("chat")]);
    stateDoc = db.doc("data/users/"+id+"/state");
    chatDoc = db.doc("data/users/"+id+"/chat");
    if(!ladeDoc("state",a)&&(Object.keys(S.plan).length||S.days.length)) save();
    ladeDoc("chat",b);
    stateGeladen=true; fertigUebernehmen(); pruefeUebungen();
    render();
  }catch(e){ console.warn("store",e); if(e&&e.code==="not_granted") zeigeZugang() }
  ladeLaeuft=false;
}

/* ---------- Trainingsdaten vom Server holen ---------- */
let syncState="idle", lastSync=0;
function setSync(cls,txt){const b=$("#sync");b.className="sync "+cls;$("#sync-t").textContent=txt}
async function syncData(manual){
  if(syncState==="busy") return;
  if(!SERVER.token()){ setSync("err","Kein Zugang"); if(manual) zeigeZugang(); return }
  syncState="busy"; setSync("busy","Prüfe …");
  try{
    let nd=await SERVER.get("daten");
    if(!nd){ nd=D&&(D.version||0)>=(FALLBACK.version||0)?D:FALLBACK; await SERVER.put("daten",nd) }
    const changed = !D || nd.version!==D.version || nd.stand!==D.stand;
    D = nd; lsSet("schach-daten", D); lastSync=Date.now();
    setSync("ok","Stand "+fmt(D.stand));
    if(changed){ render(); pruefeUebungen(); toast("Neue Daten geladen (Version "+D.version+")") }
    else if(manual) toast("Alles aktuell");
  }catch(e){
    const c=e&&e.code;
    setSync("err", D?"Stand "+fmt(D.stand):"Fehler");
    if(c==="not_granted") zeigeZugang();
    else if(manual) toast(c==="offline"?"Keine Verbindung zum Server.":"Konnte die Daten nicht laden. Später nochmal tippen.");
  }
  syncState="idle";
}
$("#sync").onclick=()=>SERVER.token()?syncData(true):zeigeZugang();
$("#sync").oncontextmenu=e=>{e.preventDefault();zeigeZugang()};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ for(const w of ["state","chat"]) if(pendingSave[w]) sichere(w); return }   /* beim Weglegen sofort speichern */
  const lang=Date.now()-lastSync>5*60*1000;
  if(lang) syncData(false);
  abgleich(true).then(()=>{ if(lang) ccHole(false) });
});
/* liegt die App offen, während das andere Gerät benutzt wird: ab und zu nachsehen */
setInterval(()=>{ if(!document.hidden) abgleich(false) },90000);

/* ---------- Ableitungen ---------- */
function curWeek(){
  if(S.weekOverride) return S.weekOverride;
  const st=new Date((D.planStart||"2026-10-28")+"T12:00:00"), n=new Date(today()+"T12:00:00");
  return Math.max(1,Math.min(8,Math.floor((n-st)/864e5/7)+1));
}
const W = n => D.wochen.find(w=>w.n===n) || D.wochen[0];
const tkey = (n,i) => "w"+n+"t"+i;
function weekDone(n){const w=W(n);return w.aufgaben.filter((_,i)=>S.plan[tkey(n,i)]).length}
function nextTask(n){const w=W(n);const i=w.aufgaben.findIndex((_,i)=>!S.plan[tkey(n,i)]);return i<0?null:{i,text:w.aufgaben[i]}}
function allItems(){return [...(D.uebungen||[]),...(S.custom||[])]}
const IV=[0,1,3,7,14,30];
/* Abgeschlossen: beim ersten Versuch gelöst oder von Hand abgehakt. Solche Fehler sind nie mehr fällig. */
const istFertig=it=>!!(S.fertig||{})[it.id];
const offeneItems=()=>allItems().filter(it=>!istFertig(it));
const fertigeItems=()=>allItems().filter(istFertig);
function isDue(it){if(istFertig(it))return false;const r=S.srs[it.id];return !r||r.due<=today()}
function dueItems(){return allItems().filter(isDue)}
/* einmalig: was bisher zuletzt richtig gelöst wurde, gilt als abgearbeitet */
function fertigUebernehmen(){
  if(S.fertigV||(stateDoc&&!stateGeladen)) return;
  S.fertig=Object.assign({},S.fertig);
  Object.keys(S.srs||{}).forEach(id=>{const r=S.srs[id];if(r&&r.box>=1&&!S.fertig[id])S.fertig[id]={d:r.due?addDays(r.due,-IV[Math.min(r.box,IV.length-1)]):today(),wie:"geloest"}});
  S.fertigV=1; save();
}
function streak(){
  const set=new Set(S.days); let d=today(), n=0;
  if(!set.has(d)) d=addDays(d,-1);
  while(set.has(d)){n++; d=addDays(d,-1)}
  return n;
}
function daysThisWeek(){const t=today();let n=0;for(let i=0;i<7;i++) if(S.days.includes(addDays(t,-i))) n++;return n}
function accuracy(filter){
  let r=0,w=0; for(const it of allItems()){ if(filter&&!filter(it)) continue; const s=S.srs[it.id]; if(s){r+=s.r||0;w+=s.w||0} }
  return {r,w,p:r+w?Math.round(r/(r+w)*100):null};
}
function markDay(){const t=today(); if(!S.days.includes(t)){S.days.push(t); S.days=S.days.slice(-400); save(); toast("Tag abgehakt. Serie: "+streak()+" Tage")}}

/* ---------- Router ---------- */

window.addEventListener("hashchange",()=>{const v=location.hash.slice(1); if(VIEWS.includes(v)&&v!==view){view=v;render()}});

const MATT=20000;
/* Harte Fakten zur Stellung aus chess.js, damit Claude nichts Falsches über das Brett erzählt */
const FAKT=(function(){
  const WERT={p:1,n:3,b:3,r:5,q:9,k:99}, FIG={k:"K",q:"D",r:"T",b:"L",n:"S",p:""};
  const farbe=f=>f==="w"?"Weiß":"Schwarz", anders=f=>f==="w"?"b":"w";
  /* gleiche Stellung, aber f ist am Zug */
  const mitZug=(fen,f)=>{const t=fen.split(" ");t[1]=f;t[3]="-";return t.join(" ")};
  const zuege=(fen,f)=>new Chess(mitZug(fen,f)).moves({verbose:true});
  const istSchach=m=>/[+#]/.test(m.san);
  function figuren(c){
    const o={w:[],b:[]};
    "abcdefgh".split("").forEach(x=>{for(let y=1;y<=8;y++){const p=c.get(x+y);if(p)o[p.color].push({n:FIG[p.type]+x+y,w:WERT[p.type]})}});
    const z=a=>a.sort((u,v)=>v.w-u.w).map(u=>u.n).join(" ");
    return "Weiß: "+z(o.w)+"\nSchwarz: "+z(o.b);
  }
  /* wie viele eigene Figuren decken das Feld: Figur umfärben, dann darf der Besitzer sie "schlagen".
     Der eigene König zählt auch, wenn nur eine Figur angreift: Die steht ja nach dem Schlagen auf dem Feld. */
  function decker(fen,feld,angreifer){
    const c=new Chess(fen), p=c.get(feld); if(!p) return 0;
    c.remove(feld); c.put({type:p.type==="k"?"q":p.type,color:anders(p.color)},feld);
    const d=zuege(c.fen(),p.color).filter(m=>m.to===feld);
    const nah=s=>Math.abs(s.charCodeAt(0)-feld.charCodeAt(0))<=1&&Math.abs(s.charCodeAt(1)-feld.charCodeAt(1))<=1;
    const koenig="abcdefgh".split("").flatMap(x=>[1,2,3,4,5,6,7,8].map(y=>x+y)).find(s=>{const q=c.get(s);return q&&q.type==="k"&&q.color===p.color});
    return d.length+(angreifer===1&&koenig&&nah(koenig)&&!d.some(m=>m.piece==="k")?1:0);
  }
  /* angegriffene Figuren, die ungedeckt sind oder von einer billigeren Figur angegriffen werden */
  function gefaehrdet(fen){
    const c=new Chess(fen), raus=[];
    ["w","b"].forEach(f=>{
      const an={};
      zuege(fen,anders(f)).filter(m=>m.captured&&m.captured!=="k").forEach(m=>(an[m.to]=an[m.to]||[]).push(m));
      Object.keys(an).forEach(feld=>{
        const p=c.get(feld); if(!p||p.color!==f) return;
        const billig=Math.min(...an[feld].map(m=>WERT[m.piece])), d=decker(fen,feld,an[feld].length);
        if(d&&billig>=WERT[p.type]) return;
        const wer=an[feld].map(m=>FIG[m.piece]+m.from).join(", ");
        raus.push(farbe(f)+" "+FIG[p.type]+feld+" (angegriffen von "+wer+(d?"":", ungedeckt")+")");
      });
    });
    return raus;
  }
  function stellung(fen){
    try{
      const c=new Chess(fen), f=c.turn(), alle=c.moves({verbose:true});
      const droht=zuege(fen,anders(f)).filter(m=>(m.captured&&m.captured!=="k")||istSchach(m)).map(m=>m.san);
      return "Figuren:\n"+figuren(c)+
        "\nAm Zug: "+farbe(f)+(c.in_check()?" (steht im Schach)":"")+
        "\nLegale Züge: "+(alle.map(m=>m.san).join(" ")||"keine")+
        "\nDavon Schlagzüge: "+(alle.filter(m=>m.captured).map(m=>m.san).join(" ")||"keine")+
        "\nDavon Schachgebote: "+(alle.filter(istSchach).map(m=>m.san).join(" ")||"keine")+
        "\nWäre "+farbe(anders(f))+" am Zug, könnte er schlagen oder Schach geben mit: "+(droht.join(" ")||"nichts")+
        "\nFiguren in Gefahr: "+(gefaehrdet(fen).join("; ")||"keine");
    }catch(e){return ""}
  }
  /* ---------- Stockfish 10 (GPL, Quelle: github.com/nmrugg/stockfish.js) ----------
     Läuft in einem eigenen Hintergrund-Prozess und wird erst bei der ersten Frage geladen.
     Klappt das nicht, geht alles weiter, nur eben ohne Bewertung. */
  const DATEI="stockfish.asm.js";
  let motor=null, ladung=null, schlange=Promise.resolve(); const zustand={weg:"",fehler:""};
  function probiere(w,weg){
    return new Promise(fertig=>{
      const ende=ok=>{clearTimeout(uhr);w.onerror=null;w.onmessage=null;if(ok){motor=w;zustand.weg=weg;w.postMessage("setoption name Contempt value 0")}else{try{w.terminate()}catch(e){}}fertig(ok)};
      const uhr=setTimeout(()=>{zustand.fehler=weg+": keine Antwort";ende(false)},15000);
      w.onerror=e=>{zustand.fehler=weg+": "+((e&&e.message)||"Start fehlgeschlagen");ende(false)};
      w.onmessage=e=>{if(String(e.data).trim()==="uciok")ende(true)};
      w.postMessage("uci");
    });
  }
  function lade(){
    if(!ladung)ladung=(async()=>{
      try{if(await probiere(new Worker(DATEI),"eigene Datei"))return true}catch(e){zustand.fehler="eigene Datei: "+e.message}
      try{
        const url=new URL(DATEI,location.href).href;
        const blob=URL.createObjectURL(new Blob(['importScripts("'+url+'")'],{type:"text/javascript"}));
        if(await probiere(new Worker(blob),"blob"))return true;
      }catch(e){zustand.fehler="blob: "+e.message}
      return false;
    })();
    return ladung;
  }
  /* eine Suche, immer nur eine gleichzeitig. Antwort: {tiefe, zeilen:[{art,zahl,pv}]} aus Sicht der Seite am Zug */
  function suche(fen,ms,mehr,tiefe){
    const lauf=schlange.then(()=>new Promise(fertig=>{
      const z={}; let tiefe=0;
      const ende=()=>{clearTimeout(uhr);motor.onmessage=null;fertig({tiefe,zeilen:Object.keys(z).sort((a,b)=>a-b).map(k=>z[k])})};
      const uhr=setTimeout(ende,ms+5000);
      motor.onmessage=e=>{
        const s=String(e.data);
        if(s.startsWith("bestmove"))return ende();
        if(!s.startsWith("info ")||/ (lower|upper)bound /.test(s))return;
        const m=s.match(/ depth (\d+).*? multipv (\d+).*? score (cp|mate) (-?\d+).*? pv (.+)$/);
        if(m){tiefe=Math.max(tiefe,+m[1]);z[m[2]]={art:m[3],zahl:+m[4],pv:m[5].trim().split(/\s+/)}}
      };
      motor.postMessage("setoption name MultiPV value "+mehr);
      motor.postMessage("position fen "+fen);
      motor.postMessage("go depth "+(tiefe||18)+" movetime "+ms);
    }));
    schlange=lauf.catch(()=>{});
    return lauf;
  }
  /* Wert immer aus Sicht von Weiß: +0,35 ist gut für Weiß */
  function wert(z,am){
    const v=am==="w"?1:-1;
    if(z.art==="mate")return "Matt in "+Math.abs(z.zahl)+" für "+(z.zahl*v>0?"Weiß":"Schwarz");
    const c=z.zahl*v/100;
    return (c<0?"−":"+")+Math.abs(c).toFixed(2).replace(".",",");
  }
  function linie(fen,pv,max){
    const c=new Chess(fen), o=[];
    for(const u of pv.slice(0,max)){const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});if(!m)break;o.push(m.san)}
    return o;
  }
  /* Gutachten für eine Stellung, auf Wunsch auch für einen bestimmten Zug darin */
  async function gutachten(fen,san,ms){
    try{
      if(!await lade())return null;
      const am=fen.split(" ")[1], a=await suche(fen,ms||2500,3);
      if(!a.zeilen.length)return null;
      let text="Stockfish 10 (Tiefe "+a.tiefe+"), Werte aus Sicht von Weiß in Bauern, beste Züge in dieser Stellung:";
      a.zeilen.forEach(z=>{const l=linie(fen,z.pv,6);if(l.length)text+="\n- "+l[0]+": "+wert(z,am)+" (Linie: "+l.join(" ")+")"});
      let kurz="Stockfish, Tiefe "+a.tiefe+": "+wert(a.zeilen[0],am);
      const c=san?new Chess(fen):null, m=c?c.move(san,{sloppy:true}):null;
      if(m){
        const am2=c.turn(), b=c.game_over()?null:await suche(c.fen(),1200,1), z=b&&b.zeilen[0];
        const w=z?wert(z,am2):c.in_checkmate()?"Matt":"Remis";
        text+="\nNach "+m.san+": "+w+(z?" (Linie: "+linie(c.fen(),z.pv,6).join(" ")+")":"");
        kurz+=" · nach "+m.san.replace(/[QRBN]/g,x=>({Q:"D",R:"T",B:"L",N:"S"})[x])+": "+w;
      }
      return {text,kurz};
    }catch(e){zustand.fehler="Suche: "+(e&&e.message);return null}
  }
  /* beste Züge einer Stellung als [{cp,san,linie}]. cp in Hundertstel-Bauern aus Sicht von Weiß,
     Matt in n als ±(MATT−n). null, wenn Stockfish nicht läuft, leer bei Matt oder Patt. */
  const rohZ=(z,am)=>{const k=am==="w"?1:-1;return z.art==="mate"?k*(z.zahl<0?-1:1)*(MATT-Math.abs(z.zahl)):k*z.zahl};
  async function lage(fen,ms,mehr,tiefe){
    try{
      if(!await lade())return null;
      const am=fen.split(" ")[1], r=await suche(fen,ms||1000,mehr||1,tiefe);
      return r.zeilen.map(z=>{const l=linie(fen,z.pv,6);return {cp:rohZ(z,am),san:l[0]||"",linie:l}}).filter(x=>x.san);
    }catch(e){zustand.fehler="Lage: "+(e&&e.message);return null}
  }
  /* kurzer Blick für das Prüf-Werkzeug */
  async function blick(fen){
    try{
      if(!await lade())return null;
      const r=await suche(fen,1000,1), z=r.zeilen[0];
      return z?{wert:wert(z,fen.split(" ")[1]),linie:linie(fen,z.pv,6),tiefe:r.tiefe}:null;
    }catch(e){return null}
  }
  /* ganze Partie: jede Stellung kurz prüfen und die größten Fehler herausziehen */
  async function partie(hist,seite,melde,signal,punkt){
    try{
      if(!await lade())return "";
      const c=new Chess(), ms=Math.max(120,Math.min(300,Math.round(45000/(hist.length+1))));
      const kappe=z=>z.art==="mate"?(z.zahl>0?1500:-1500):Math.max(-1500,Math.min(1500,z.zahl));
      const schau=async()=>{const am=c.turn(),r=await suche(c.fen(),ms,1),z=r.zeilen[0];return z?{cp:kappe(z)*(am==="w"?1:-1),z,am}:null};
      /* für den Verlauf: Hundertstel-Bauern aus Sicht von Weiß, Matt in n als ±(MATT−n) */
      const roh=x=>{const k=x.am==="w"?1:-1,z=x.z;return z.art==="mate"?k*(z.zahl<0?-1:1)*(MATT-Math.abs(z.zahl)):k*z.zahl};
      const fehler=[]; let vor=await schau();
      if(punkt)punkt(0,vor?roh(vor):0,"");
      for(let i=0;i<hist.length;i++){
        if(signal&&signal.aborted)return "";
        melde(Math.floor(i/2)+1,Math.ceil(hist.length/2));
        const fen=c.fen(), wer=c.turn(), m=c.move(hist[i]); if(!m)break;
        const nach=c.game_over()?null:await schau(), cp=nach?nach.cp:c.in_checkmate()?(wer==="w"?1500:-1500):0;
        if(punkt)punkt(i+1,nach?roh(nach):c.in_checkmate()?(wer==="w"?MATT:-MATT):0,vor?linie(fen,vor.z.pv,1)[0]||"":"");
        if(vor&&(!seite||wer===seite)){
          const weg=(vor.cp-cp)*(wer==="w"?1:-1), besser=linie(fen,vor.z.pv,5);
          if(weg>=100&&besser[0]&&besser[0]!==m.san)fehler.push({weg,t:"Zug "+(Math.floor(i/2)+1)+" "+farbe(wer)+": gespielt "+m.san+", Wert von "+wert(vor.z,vor.am)+" auf "+(nach?wert(nach.z,nach.am):"Spielende")+", besser wäre "+besser[0]+" (Linie: "+besser.join(" ")+")"});
        }
        vor=nach;
      }
      const liste=fehler.sort((a,b)=>b.weg-a.weg).slice(0,5).map(f=>"- "+f.t).join("\n");
      return "Stockfish 10 hat jede Stellung der Partie kurz geprüft (Werte aus Sicht von Weiß in Bauern).\n"+(liste?"Größte Fehler:\n"+liste:"Grobe Fehler (mehr als ein Bauer Verlust) hat Stockfish nicht gefunden.");
    }catch(e){zustand.fehler="Partie: "+(e&&e.message);return ""}
  }
  

  /* Werkzeug für Claude: Varianten auf dem echten Brett durchspielen statt raten */
  const pruefer=melde=>({
    name:"zuege_testen",
    description:"Spielt eine Zugfolge von einer Stellung aus auf einem echten Brett. Gibt zurück, ob jeder Zug legal ist, und für die Stellung danach: wer am Zug ist, Schach, Matt, Patt, Figuren in Gefahr, Schlagzüge, Schachgebote und die Stockfish-Bewertung mit bester Fortsetzung. Nutze es für jede Variante, die du nennen willst.",
    inputSchema:{type:"object",properties:{fen:{type:"string",description:"Ausgangsstellung als FEN"},zuege:{type:"array",items:{type:"string"},description:"Züge in englischer SAN, z. B. Nf3, exd4, O-O"}},required:["fen","zuege"]},
    async execute(e){
      if(melde) melde();
      const fen=String(e&&e.fen||""), c=new Chess();
      if(!c.validate_fen(fen).valid) throw new Error("Ungültige FEN");
      c.load(fen);
      const ok=[];
      for(const s of [].concat(e.zuege||[]).slice(0,24)){
        const m=c.move(String(s),{sloppy:true});
        if(!m) return {illegal:String(s),gespielt:ok,fen:c.fen(),legal:c.moves()};
        ok.push(m.san);
      }
      const alle=c.moves({verbose:true});
      const raus={gespielt:ok,fen:c.fen(),amZug:farbe(c.turn()),schach:c.in_check(),matt:c.in_checkmate(),patt:c.in_stalemate(),
        schlagzuege:alle.filter(m=>m.captured).map(m=>m.san),schachgebote:alle.filter(istSchach).map(m=>m.san),inGefahr:gefaehrdet(c.fen())};
      if(!c.game_over()){const sf=await blick(c.fen());if(sf)raus.stockfish=sf}
      return raus;
    }
  });
  /* Sammelantwort zerlegen: vor jeder Antwort steht eine Zeile "=== Nummer" */
  function verteile(liste,t,ende,zeig){
    if(liste.length===1){liste[0].a=t.replace(/^\s*===\s*1\s*$/m,"").trim();zeig(liste[0]);return}
    const marken=[], re=/^[ \t]*===[ \t]*(\d+)[ \t]*$/gm; let m;
    while((m=re.exec(t)))marken.push({nr:+m[1]-1,von:m.index,bis:re.lastIndex});
    if(!marken.length){
      if(ende){liste[0].a=t.trim();liste.slice(1).forEach(it=>{it.a="Die Antwort steht bei deiner ersten Frage."});liste.forEach(zeig)}
      return;
    }
    marken.forEach((k,i)=>{const it=liste[k.nr]; if(it){it.a=t.slice(k.bis,i+1<marken.length?marken[i+1].von:t.length).replace(/\n=*\s*$/,"").trim();zeig(it)}});
    if(ende)liste.forEach(it=>{if(!it.a){it.a="Dazu kam keine Antwort. Stell die Frage bitte nochmal.";zeig(it)}});
  }
  /* kleines Brett zur Frage, damit man am Ende noch sieht, worum es ging */
  function brett(fen,unten,san){
    try{
      const c=new Chess(fen), F={k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}, O={k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"};
      const m=san?new Chess(fen).move(san,{sloppy:true}):null, kipp=unten==="b"; let h="";

${sf?sf.text+"\n":""}${c.extra?c.extra+"\n":""}

  try{

}

const vlZug=(hist,p)=>(Math.floor((p-1)/2)+1)+((p-1)%2?"…":".")+de(hist[p-1]);
const vlZahl=cp=>Math.abs(cp)>=MATT?"Matt":Math.abs(cp)>=15000?"Matt in "+(MATT-Math.abs(cp)):(cp<0?"−":"+")+(Math.abs(cp)/100).toFixed(1).replace(".",",");
function vlLage(cp){
  const a=Math.abs(cp), wer=cp>0?"Weiß":"Schwarz";
  if(a>=MATT) return wer+" hat mattgesetzt";
  if(a>=15000) return wer+" setzt matt in "+(MATT-a);

function vlGenau(V,farbe){
  let s=0,n=0;
  for(let p=1;p<V.v.length;p++){
    const weiss=p%2===1; if((weiss?"w":"b")!==farbe||V.v[p]==null||V.v[p-1]==null) continue;
    const k=weiss?1:-1, weg=Math.max(0,(chance(V.v[p-1])-chance(V.v[p]))*k*50);
    s+=Math.max(0,Math.min(100,103.1668*Math.exp(-.04354*weg)-3.1669)); n++;
  }
  return n?Math.round(s/n):null;
}

function vlSatz(V,hist,p){

/* zeigt beim Ziehen übers Diagramm die Stellung sofort, ohne die ganze Seite neu aufzubauen */
function vlVorschau(o,g,hist,V,p,brett){

function vlBinde(o,g,hist,ziel){
  const V=()=>(vlJob&&vlJob.id===g.id?vlJob.V:VL[g.id]);

  let zuletzt=-1;
  const zeig=(e,brett)=>{const p=plyAus(e); if(p===zuletzt) return; zuletzt=p; vlVorschau(o,g,hist,V(),p,brett&&ziel.brett)};
  const weg=()=>{const t=o.querySelector(".vl-tip"); if(t)t.hidden=true; zuletzt=-1};
  /* beim Tippen mit dem Finger noch nichts umstellen: es könnte auch der Anfang vom Scrollen sein */
  let startX=0, startY=0;
  o.onpointerdown=e=>{if(!e.target.closest(".vl-feld"))return;vlZieht=true;zuletzt=-1;startX=e.clientX;startY=e.clientY;try{o.setPointerCapture(e.pointerId)}catch(x){}zeig(e,e.pointerType==="mouse")};
  o.onpointermove=e=>{if(vlZieht)zeig(e,true);else if(e.pointerType==="mouse"&&e.target.closest(".vl-feld"))zeig(e,false);else if(e.pointerType==="mouse")weg()};

/* ---------- Brett ---------- */
const FILL={k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}, OUT={k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"};
const NAME={k:"König",q:"Dame",r:"Turm",b:"Läufer",n:"Springer",p:"Bauer"}, FILES="abcdefgh";
let ro=null;
function drawBoard(el,game,o){
  el.innerHTML=""; const flip=o.flip;
  let targets={};
  if(o.sel) game.moves({square:o.sel,verbose:true}).forEach(m=>targets[m.to]=m.captured?"cap":"dot");
  for(let r=1;r<=8;r++)for(let f=0;f<8;f++){
    const s=FILES[f]+r, b=document.createElement("button");
    const col=flip?7-f:f, row=flip?r-1:8-r;
    b.className="sq "+((f+r)%2?"d":"l"); b.type="button";
    b.style.left=(col*12.5)+"%"; b.style.top=(row*12.5)+"%";
    if(o.last&&o.last.includes(s)) b.classList.add("hl");
    if(o.sel===s) b.classList.add("sel");
    if(o.marks&&o.marks[s]) b.classList.add(o.marks[s]);
    const p=game.get(s);
    b.setAttribute("aria-label",s+(p?" "+(p.color==="w"?"weißer ":"schwarzer ")+NAME[p.type]:""));
    if(p){const d=document.createElement("span");d.className="pc "+p.color;d.innerHTML='<span class="f">'+FILL[p.type]+'︎</span><span class="o">'+OUT[p.type]+'︎</span>';b.appendChild(d)}
    if(targets[s]){const d=document.createElement("i");d.className="dot"+(targets[s]==="cap"?" cap":"");b.appendChild(d)}
    if(col===0){const c=document.createElement("span");c.className="coord r";c.textContent=r;b.appendChild(c)}
    if(row===7){const c=document.createElement("span");c.className="coord f";c.textContent=FILES[f];b.appendChild(c)}
    b.onclick=()=>o.onTap&&o.onTap(s); el.appendChild(b);
  }
  const size=()=>el.style.setProperty("--pc",(el.clientWidth/8*0.82)+"px"); size();
  if(ro) ro.disconnect(); if(window.ResizeObserver){ro=new ResizeObserver(size);ro.observe(el)}
}
function movesText(h,startN,startBlack){let t="",n=startN||1,black=!!startBlack;h.forEach((m,i)=>{if(!black){t+=n+"."+de(m)+" "}else{t+=(i===0?n+"…":"")+de(m)+" ";n++}black=!black});return t.trim()}

/* ---------- Wiederholung ---------- */
function startReview(list,label){
  if(typeof Chess==="undefined"){toast("Das Brett konnte nicht laden. Seite neu öffnen.");return}
  if(!list.length) return;
  review={list:list.slice(),pos:0,label,res:{},tries:0,phase:"ask",sel:null,marks:{},game:null,last:null,fb:""};
  loadItem(); render(); window.scrollTo(0,0);
}
function loadItem(){
  const it=review.list[review.pos]; const g=it.fen?new Chess(it.fen):new Chess(); let lm=null;
  if(it.line) it.line.forEach(m=>{lm=g.move(m)});
  Object.assign(review,{game:g,last:lm?[lm.from,lm.to]:null,sel:null,marks:{},tries:0,phase:"ask",fb:"",turned:false,tried:null});
}
function grade(it,ok){
  if(it.id in review.res) return; review.res[it.id]=ok;
  const r=S.srs[it.id]||{box:0,r:0,w:0};
  if(ok){r.box=Math.min(IV.length-1,(r.box||0)+1);r.r=(r.r||0)+1;r.due=addDays(today(),IV[r.box])}
  else{r.box=0;r.w=(r.w||0)+1;r.due=addDays(today(),1)}
  S.srs[it.id]=r;
  if(ok&&!istFertig(it)){S.fertig[it.id]={d:today(),wie:"geloest"};review.zu=(review.zu||0)+1}
  else if(!ok&&istFertig(it)){delete S.fertig[it.id];review.auf=(review.auf||0)+1}
  save();
}
function renderReview(v){
  const R=review, it=R.list[R.pos];
  if(!it){return reviewEnd(v)}
  const g=R.game, stm=(it.fen?new Chess(it.fen):(()=>{const x=new Chess();(it.line||[]).forEach(m=>x.move(m));return x})()).turn();
  const me=it.seite||stm, flip=(me==="b")!==!!R.turned, w=stm==="w"; const sw=(D.schwaechen||[]).find(s=>s.id===it.schwaeche);
  v.innerHTML=`<section><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(R.label||"Wiederholung")} · ${R.pos+1} von ${R.list.length}</span><span class="row"><button class="btn s" type="button" id="rev-flip">Brett drehen</button><button class="btn s" type="button" id="rev-x">Beenden</button></span></div>
   <div class="bar"><i style="width:${R.pos/R.list.length*100}%"></i></div></section>
   <div class="trainer-box"><div class="board" id="board" role="grid" aria-label="Schachbrett"></div>
   <div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="card">
    <div class="row">${sw?`<span class="tag">${esc(sw.titel)}</span>`:""}<span class="tag">${esc(it.quelle||"")}</span></div>
    ${it.line?`<div class="moves">${movesText(it.line)}</div>`:""}
    <p class="ask">${esc(it.frage)}</p>
    <span class="turn"><i style="background:${w?"#fbfaf6":"#1b1f1c"}"></i>${w?"Weiß":"Schwarz"} zieht · Du siehst das Brett als ${flip?"Schwarz":"Weiß"}</span></div>
    <div id="fb">${R.fb||'<div class="fb info"><p>Erst Schachs, Schlagzüge und Drohungen prüfen, dann ziehen.</p></div>'}</div>${notizLeiste(R)}</div></div>`;
  drawBoard($("#board"),g,{flip,last:R.last,sel:R.sel,marks:R.marks,onTap:tapReview});
  $("#rev-x").onclick=()=>{ if((R.notes||[]).length){R.abbruch=true;R.pos=R.list.length;render()} else {review=null;render()} };
  $("#rev-flip").onclick=()=>{review.turned=!review.turned;render()};
  bindNotiz();
  bindFb();
}
function bindFb(){
  const n=$("#rv-next"); if(n) n.onclick=()=>{review.pos++; if(review.pos<review.list.length) loadItem(); render()};
  const r=$("#rv-retry"); if(r) r.onclick=()=>{loadItem();render()};
  const s=$("#rv-sol"); if(s) s.onclick=()=>{const it=review.list[review.pos];loadItem();const m=review.game.move(it.antwort[0],{sloppy:true});grade(it,false);review.phase="done";review.last=[m.from,m.to];review.marks={[m.to]:"ok"};review.fb=fbHTML("info","Lösung: "+de(m.san),it.warum,true);render()};
}
const fbHTML=(k,t,x,next,extra)=>`<div class="fb ${k}"><b>${esc(t)}</b><p>${esc(x)}</p>${extra?`<p class="small"><b>${esc(extra)}</b></p>`:""}<div class="row">${next?'<button class="btn p" type="button" id="rv-next">Weiter</button>':'<button class="btn p" type="button" id="rv-retry">Nochmal</button><button class="btn" type="button" id="rv-sol">Lösung zeigen</button>'}</div></div>`;
function tapReview(s){
  const R=review; if(R.phase!=="ask") return; const g=R.game, p=g.get(s);
  if(R.sel){const mv=g.moves({square:R.sel,verbose:true}).find(m=>m.to===s); if(mv) return tryMove(mv)}
  if(p&&p.color===g.turn()){R.sel=R.sel===s?null:s} else R.sel=null;
  render();
}
function tryMove(mv){
  const R=review, it=R.list[R.pos]; R.sel=null; const fenBefore=R.game.fen();
  const m=R.game.move({from:mv.from,to:mv.to,promotion:"q"}); R.last=[m.from,m.to];
  const san=strip(m.san), ans=it.antwort.map(strip); R.tried={fenBefore,san:m.san,ok:ans.includes(san)};
  const okMap={}, badMap={}; for(const k in (it.ok||{})) okMap[strip(k)]=it.ok[k]; for(const k in (it.falsch||{})) badMap[strip(k)]=it.falsch[k];
  if(ans.includes(san)){const neu=R.tries===0&&!istFertig(it)&&!(it.id in R.res);grade(it,R.tries===0);R.marks={[m.to]:"ok"};R.phase="done";R.fb=fbHTML("good","Richtig: "+de(m.san),it.warum,true,neu?"Damit ist dieser Fehler abgeschlossen.":"")}
  else{R.tries++;grade(it,false);R.marks={[m.to]:"no"};R.phase="wrong";
    if(okMap[san]) R.fb=fbHTML("warn","Spielbar, aber nicht der beste: "+de(m.san),okMap[san]);
    else if(badMap[san]) R.fb=fbHTML("bad","Fehler: "+de(m.san),badMap[san]);
    else R.fb=fbHTML("bad","Nicht der beste Zug: "+de(m.san),"Schau noch einmal: Was droht, was hängt, welche Schachs gibt es?");}
  render();
}
function reviewEnd(v){
  const R=review, ok=Object.values(R.res).filter(Boolean).length, n=R.abbruch?Object.keys(R.res).length:R.list.length;
  if(R.label==="Heute"&&!R.stepped&&!R.abbruch){R.stepped=true;setStep("wdh",true)}
  v.innerHTML=`<section class="card"><span class="eyebrow">${esc(R.label||"Wiederholung")} fertig</span><h1>${ok} von ${n} beim ersten Versuch</h1>
   <p class="muted">${[R.zu?(R.zu===1?"1 Fehler ist":R.zu+" Fehler sind")+" jetzt abgeschlossen.":"",R.auf?(R.auf===1?"1 abgeschlossener Fehler ist":R.auf+" abgeschlossene Fehler sind")+" wieder offen.":"",n-ok>0?"Die falschen kommen morgen wieder. So prägt sich das Muster ein.":R.zu?"":"Sitzt weiterhin."].filter(Boolean).join(" ")}</p>
   <div class="row"><button class="btn p" type="button" id="rv-done">Fertig</button><button class="btn" type="button" id="rv-chat">Mit dem Trainer besprechen</button></div></section>${notizBlock(R)}`;
  $("#rv-done").onclick=()=>{review=null;render()};
