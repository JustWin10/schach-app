plugins {
    id 'com.android.application'
}

// Adresse der App und Versionsnummer setzt der GitHub-Workflow beim Bauen
def appUrl = (project.findProperty('appUrl') ?: 'https://example.invalid/').toString()
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'de.irmscher.schach'
    compileSdk 35

    defaultConfig {
        applicationId 'de.irmscher.schach'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1." + vCode
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file('../release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('KS_PW') ?: ''
            keyAlias 'schach'
            keyPassword System.getenv('KS_PW') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
